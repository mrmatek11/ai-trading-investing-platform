name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    name: Bot — testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  tape-backend:
    name: Tape — backend (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tape
          POSTGRES_PASSWORD: tape
          POSTGRES_DB: tape_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tape -d tape_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: tape/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: python -m pytest -q
        env:
          TAPE_TEST_POSTGRES_URL: postgresql+psycopg://tape:tape@localhost:5432/tape_test

  tape-web:
    name: Tape — frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tape/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tape/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  tape-docker:
    name: Tape — obrazy Docker
    runs-on: ubuntu-latest
    needs: [tape-backend, tape-web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tape/docker-compose.yml build
