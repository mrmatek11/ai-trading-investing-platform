# Migracje bazy Tape. Nowa migracja po zmianie modeli:
#   DATABASE_URL=sqlite:///dev.db alembic upgrade head
#   DATABASE_URL=sqlite:///dev.db alembic revision --autogenerate -m "opis"
# Przejrzyj wygenerowany plik przed commitem (autogenerate nie widzi np. zmian nazw kolumn).
[alembic]
script_location = tape/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
