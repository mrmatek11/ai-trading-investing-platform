[project]
name = "tape"
version = "0.1.0"
description = "Tape — trading journal, portfolio and market terminal for gold and silver traders"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
