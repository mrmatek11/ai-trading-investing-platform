server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # import plików i ceny — limit nieco wyższy niż w API, żeby błąd zwracało API, nie nginx
    client_max_body_size 60m;

    # Kompresja: JS/CSS i odpowiedzi API (statystyki z tysiącami transakcji to ~1 MB JSON → ~10× mniej).
    # Obraz nginx:alpine ma gzip domyślnie wyłączony.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    # Uwaga: add_header w bloku location kasuje nagłówki z bloku server — dlatego include w każdym.
    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # pliki z hashem w nazwie — długi cache
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # SPA: każda ścieżka aplikacji → index.html
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
